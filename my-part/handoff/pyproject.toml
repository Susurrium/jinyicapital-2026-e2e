[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptop"
version = "0.1.0"
description = "进益资本杯 A 成员云端数据与输入编码交接包"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==20.0.0",
  "torch==2.8.0",
  "pyqlib==0.0.0+git.54355232463878d2eebb91fe0ee5fa7fa1f5976c",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --basetemp=work/pytest-temp"
cache_dir = "work/pytest-cache"
