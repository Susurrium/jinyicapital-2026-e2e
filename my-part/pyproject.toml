[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ptop"
version = "0.1.0"
description = "进益资本杯分钟数据适配、冻结预处理与输入编码"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==20.0.0",
  "psutil==7.2.2",
  "torch==2.8.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ptop._vendor.qlib" = ["LICENSE", "SOURCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=work/pytest-temp"
cache_dir = "work/pytest-cache"

